<rect x="602" y="268" width="218" height="132" rx="18" fill="none" stroke="#77886a" stroke-width="2"/><text x="627" y="315" class="label">Service</text><text x="627" y="352" class="sub">Validation + logic</text>
<rect x="869" y="268" width="263" height="132" rx="18" fill="none" stroke="#77886a" stroke-width="2"/><text x="894" y="315" class="label">DAO / JDBC</text><text x="894" y="352" class="sub">Database access</text>
