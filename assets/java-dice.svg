<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Java dice frequency simulator concept</title><desc id="desc">Illustration of a ten-roll Java dice simulator, counting each face and printing frequencies. Six die faces are shown without invented result counts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#77886a"/></marker></defs><rect width="1200" height="800" fill="#eee9df"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#182525}.eyebrow{font-size:17px;letter-spacing:3px}.title{font-size:45px;font-weight:600;letter-spacing:-1.5px}.label{font-size:24px;font-weight:600}.sub{font-size:19px;fill:#536252}.mono{font-family:Consolas,monospace}.fine{font-size:16px;fill:#536252}.line{stroke:#77886a;stroke-width:2;fill:none;marker-end:url(#arrow)} </style><text x="68" y="72" class="eyebrow">TERM 01 / JAVA FUNDAMENTALS</text><text x="66" y="137" class="title">Where the foundations began.</text><text x="68" y="186" class="sub">An early Java exercise in loops, arrays, random values, and counting.</text>
